<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Choti 🍿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .step-container {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            z-index: 10;
        }
        #step1 {
            display: flex; 
        }
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 3rem;
            color: #fff;
        }
        .button-group {
            display: flex;
            gap: 2rem;
            align-items: center;
            justify-content: center;
            height: 100px;
            width: 100%;
            position: relative;
        }
        button, .btn-link {
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.25rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-yes {
            background-color: #dc2626;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
            animation: pulse 2s infinite;
            z-index: 20;
        }
        .btn-yes:hover {
            background-color: #ef4444;
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
        }
        .btn-no {
            background-color: #374151;
            color: #9ca3af;
            transition: all 0.2s ease;
            z-index: 15;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        input[type="text"] {
            padding: 12px 24px;
            border-radius: 50px;
            background-color: #1f2937;
            border: 2px solid #dc2626;
            color: white;
            font-size: 1.1rem;
            width: 250px;
            text-align: center;
            margin-bottom: 2rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ef4444;
        }
        .final-title {
            font-size: 3.5rem;
            color: #ef4444;
            margin-bottom: 1rem;
            z-index: 20;
        }
        .final-subtitle {
            font-size: 1.25rem;
            color: #d1d5db;
            margin-bottom: 2rem;
            z-index: 20;
        }
        .btn-fallback {
            background-color: #16a34a;
            color: white;
            z-index: 20;
            display: inline-block;
            margin-top: 1rem;
        }
        .movie-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
            background-image: repeating-linear-gradient(
                45deg, #111 25%, #1a1a1a 25%, #1a1a1a 50%,
                #111 50%, #111 75%, #1a1a1a 75%, #1a1a1a 100%
            );
            background-size: 40px 40px;
            animation: moveBg 10s linear infinite;
        }
        @keyframes moveBg {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #dc2626;
            animation: fall 3s linear infinite;
            z-index: 5;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .final-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Step 1 -->
    <div id="step1" class="step-container">
        <h1>Choti ek baath puchu?</h1>
        <div class="button-group">
            <button onclick="nextStep(2)" class="btn-yes">Yes</button>
            <button id="noBtn1" onmouseover="moveButton('noBtn1')" onclick="moveButton('noBtn1')" class="btn-no">No</button>
        </div>
    </div>

    <!-- Step 2 -->
    <div id="step2" class="step-container">
        <div class="movie-bg"></div>
        <h1>satuday gmeet pei movies dekhte hai?</h1>
        <div class="button-group">
            <button onclick="nextStep(3)" class="btn-yes">Yes</button>
            <button id="noBtn2" onmouseover="moveButton('noBtn2')" onclick="moveButton('noBtn2')" class="btn-no">No</button>
        </div>
    </div>

    <!-- Step 3 -->
    <div id="step3" class="step-container">
        <div class="movie-bg"></div>
        <h1>what movie do you want to watch chotiii</h1>
        <input type="text" id="movieInput" placeholder="Type movie name here...">
        <button onclick="submitMovie()" class="btn-yes">Submit</button>
    </div>

    <!-- Step 4 -->
    <div id="step4" class="step-container">
        <h1 class="final-title">HAPPY HAPPY HAPPY</h1>
        <p class="final-subtitle">Opening WhatsApp to confirm...</p>
        
        <a id="whatsappFallback" href="#" class="btn-link btn-fallback">
            Click here if WhatsApp doesn't open
        </a>
        
        <div id="confetti-container" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;"></div>
    </div>

    <script>
        let noClickCount = 0;

        function nextStep(step) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step' + step).style.display = 'flex';
        }

        function moveButton(btnId) {
            const btn = document.getElementById(btnId);
            noClickCount++;

            if (noClickCount === 1) {
                btn.innerText = "ajeeb hu ill ask anyway";
            } else if (noClickCount === 2) {
                btn.innerText = "pls pls pls";
            } else if (noClickCount >= 3) {
                btn.innerText = "YES (points this way 👉)";
            }

            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 50);
            
            btn.style.position = 'fixed';
            btn.style.left = Math.max(10, x) + 'px';
            btn.style.top = Math.max(10, y) + 'px';
        }

        function submitMovie() {
            const movie = document.getElementById('movieInput').value;
            if (!movie) return;

            document.getElementById('step3').style.display = 'none';
            document.getElementById('step4').style.display = 'flex';
            createConfetti();

            const myPhoneNumber = "918977628214"; 
            const message = "Hiii! I said YES! Let's watch " + movie + " on Saturday! 🍿";
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${myPhoneNumber}&text=${encodeURIComponent(message)}`;

            document.getElementById('whatsappFallback').href = whatsappUrl;
            window.location.href = whatsappUrl;
        }

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#dc2626', '#ef4444', '#9ca3af', '#374151'];
            
            for (let i = 0; i < 75; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
